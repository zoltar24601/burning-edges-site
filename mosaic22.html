<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2022 Mosaic Road to World Cup Pack &middot; Burning Edges</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@400;500;600&display=swap');
  :root{
    --pine-3:#0a1f12;--card:#13301f;--card-2:#0f2618;--border:#1f4a30;--border-bright:#2d6344;
    --gold:#e8c468;--gold-dim:#b89540;--cream:#f4efe1;--text:#e8efe6;--text-dim:#8fab97;--text-faint:#5a7563;
    --green:#5ed68a;--red:#e8736a;--flame:#d6a44e;--accent:#b89be0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--pine-3);color:var(--text);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;padding-bottom:60px;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(214,164,78,0.06),transparent 40%),radial-gradient(circle at 80% 90%,rgba(94,214,138,0.03),transparent 40%);pointer-events:none;z-index:0;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;position:relative;z-index:1;}
  a{color:inherit;}
  header{border-bottom:1px solid var(--border);background:rgba(10,31,18,0.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;}
  .header-inner{max-width:1080px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
  .brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:1px;color:var(--cream);text-transform:uppercase;text-decoration:none;}
  .brand .flame{color:var(--flame);}
  .topnav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
  .topnav a{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1.5px;color:var(--text-faint);text-transform:uppercase;text-decoration:none;}
  .topnav a:hover{color:var(--gold);}
  .topnav a.active{color:var(--accent);}
  .hero{padding:40px 0 18px;text-align:center;}
  .release-name{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:10px;}
  .hero h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(36px,7vw,60px);line-height:0.98;text-transform:uppercase;color:var(--cream);}
  .hero h1 .accent{color:var(--accent);}
  .updated{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2px;color:var(--text-faint);text-transform:uppercase;margin-top:14px;}
  .disclaimer{background:rgba(232,196,104,0.07);border:1px solid var(--gold-dim);border-left:3px solid var(--gold);border-radius:10px;padding:16px 20px;margin:14px 0 30px;font-size:13.5px;color:var(--text-dim);line-height:1.6;}
  .disclaimer strong{color:var(--gold);}
  .price-band{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin:0 0 14px;}
  .price-card.exp{border-color:var(--accent);}
  .price-card.exp .label{color:var(--accent);}
  .price-card.exp .price-big{color:var(--accent);}
  @media(max-width:760px){.price-band{grid-template-columns:1fr;}}
  .price-card{background:linear-gradient(160deg,var(--card),var(--card-2));border:1px solid var(--border-bright);border-radius:14px;padding:26px 30px;}
  .price-card.book{border-color:var(--green);}
  .price-card.mkt{border-color:var(--gold-dim);}
  .price-card .label{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}
  .price-card.book .label{color:var(--green);}
  .price-card.mkt .label{color:var(--gold);}
  .price-big{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:52px;line-height:1;color:var(--cream);}
  .price-card.mkt .price-big{color:var(--gold);}
  .price-sub{font-size:12.5px;color:var(--text-faint);margin-top:10px;}
  .compose{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 30px;}
  @media(max-width:760px){.compose{grid-template-columns:1fr 1fr;}}
  .slot{background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
  .slot.hit{border-color:var(--accent);}
  .slot .n{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:30px;color:var(--cream);line-height:1;}
  .slot.hit .n{color:var(--accent);}
  .slot .d{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;margin-top:6px;line-height:1.4;}
  .section-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin:40px 0 4px;}
  .section-sub{font-size:13px;color:var(--text-faint);margin-bottom:18px;}
  table{width:100%;border-collapse:collapse;}
  .s2 th{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-faint);text-align:right;padding:8px 10px;border-bottom:1px solid var(--border);}
  .s2 th:first-child{text-align:left;}
  .s2 td{padding:9px 10px;border-bottom:1px solid rgba(31,74,48,0.5);font-size:14px;text-align:right;}
  .s2 td:first-child{text-align:left;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;color:var(--cream);}
  .s2 .sub{color:var(--text-faint);font-weight:400;font-size:12.5px;}
  .foot{margin-top:44px;font-size:12px;color:var(--text-faint);text-align:center;line-height:1.7;}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a class="brand" href="/">BURNING <span class="flame">EDGES</span></a>
    <nav class="topnav">
      <a href="/packs">&larr; All Packs</a>
      <a href="/prizmwc22">2022 Prizm WC</a>
      <a href="/mosaic22" class="active">2022 Mosaic</a>
      <a href="/stickers">WC Stickers</a>
      <a href="/value">Value My Card</a>
    </nav>
  </div>
</header>
<div class="wrap">
  <div class="hero">
    <div class="release-name" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <div class="updated" id="updated"></div>
  </div>
  <div class="disclaimer" id="disclaimer"></div>
  <div class="price-band">
    <div class="price-card book">
      <div class="label">Book value / pack</div>
      <div class="price-big" id="book"></div>
      <div class="price-sub" id="bookSub"></div>
    </div>
    <div class="price-card exp">
      <div class="label">Expected pack price</div>
      <div class="price-big" id="exp"></div>
      <div class="price-sub">2&times; book value</div>
    </div>
    <div class="price-card mkt">
      <div class="label" id="mktLabel"></div>
      <div class="price-big" id="mkt"></div>
      <div class="price-sub" id="mktSub"></div>
    </div>
  </div>
  <div class="compose" id="compose"></div>
  <div class="section-label">Top hits still in packs</div>
  <div class="section-sub" id="hitsSub"></div>
  <table class="s2"><thead><tr><th>Card</th><th>Run</th><th>In packs</th><th>Value each</th></tr></thead><tbody id="hits"></tbody></table>
  <div class="section-label" id="breakLabel"></div>
  <div class="section-sub" id="breakSub"></div>
  <table class="s2"><thead id="breakHead"></thead><tbody id="break"></tbody></table>
  <div class="foot" id="foot"></div>
</div>
<script>
const D = {"eyebrow": "2022 Panini NFT Mosaic Road to World Cup \u00b7 Spend Promo Reward", "h1": "2022 Mosaic <span class=\"accent\">Road to WC</span>", "updated": "59,156 packs remaining (copies from the Panini collection report)", "disclaimer": "<strong>How this pack works.</strong> 3 cards: <strong>2 Base</strong> + <strong>1 hit</strong> (parallel, insert or auto from a 40-cardset pool). These packs are no longer sold; Panini hands them out as <strong>Spend Promo rewards</strong> and airdrops. Priced on <strong>2026 sales only</strong> (Mosaic commons clear $1&ndash;2), with grail values set by hand for the sealed 1/1s and star Golds. The grail tail drives most of the value. Not financial advice.", "book": 14.38, "book_sub": "2 base at $2.86 + 1 hit at $8.66", "hits": [{"c": "Erling Haaland", "s": "Base Mosaic Black", "r": 1, "u": 1, "p": 100000}, {"c": "Lionel Messi", "s": "Base Mosaic Black", "r": 1, "u": 1, "p": 50000}, {"c": "Erling Haaland", "s": "Pitch Masters Mosaic Black", "r": 1, "u": 1, "p": 25000}, {"c": "Lionel Messi", "s": "Base Mosaic Gold", "r": 10, "u": 2, "p": 10000}, {"c": "Erling Haaland", "s": "Base Mosaic Gold", "r": 10, "u": 3, "p": 7000}, {"c": "Kylian Mbappe", "s": "Base Mosaic Gold", "r": 10, "u": 5, "p": 5000}, {"c": "Cristiano Ronaldo", "s": "Base Mosaic Gold", "r": 10, "u": 7, "p": 5000}, {"c": "Lionel Messi", "s": "Montage Mosaic Gold", "r": 10, "u": 2, "p": 3500}, {"c": "Lionel Messi", "s": "Breakaway Mosaic Gold Fluorescent", "r": 10, "u": 5, "p": 1500}, {"c": "Erling Haaland", "s": "Pitch Masters Mosaic Gold", "r": 10, "u": 3, "p": 1500}, {"c": "Erling Haaland", "s": "Breakaway Mosaic Gold Fluorescent", "r": 10, "u": 3, "p": 1500}, {"c": "Cristiano Ronaldo", "s": "Autographs Mosaic Gold", "r": 10, "u": 4, "p": 800}, {"c": "Cristiano Ronaldo", "s": "Autographs Mosaic Choice Fusion Red", "r": 88, "u": 35, "p": 700}, {"c": "Luka Modric", "s": "Base Mosaic Gold", "r": 10, "u": 1, "p": 600}, {"c": "Cristiano Ronaldo", "s": "Breakaway Mosaic Gold Fluorescent", "r": 10, "u": 3, "p": 600}, {"c": "Cristiano Ronaldo", "s": "Autographs Mosaic Choice Black Gold", "r": 5, "u": 1, "p": 520}, {"c": "Lionel Messi", "s": "Base Mosaic Purple", "r": 49, "u": 16, "p": 500}, {"c": "Bukayo Saka", "s": "Base Mosaic Black", "r": 1, "u": 1, "p": 500}, {"c": "Kevin De Bruyne", "s": "Scripts Mosaic Black", "r": 1, "u": 1, "p": 500}, {"c": "Zlatan Ibrahimovic", "s": "Pitch Masters Mosaic Black", "r": 1, "u": 1, "p": 500}, {"c": "Zlatan Ibrahimovic", "s": "Base Mosaic Black", "r": 1, "u": 1, "p": 500}, {"c": "Florian Wirtz", "s": "Base Mosaic Black", "r": 1, "u": 1, "p": 500}, {"c": "Erling Haaland", "s": "Base Mosaic Blue", "r": 75, "u": 35, "p": 400}, {"c": "Neymar", "s": "Base Mosaic Gold", "r": 10, "u": 5, "p": 400}], "break_label": "Hit slot by cardset", "break_sub": "The biggest contributors to the hit slot's value (copies still in packs \u00d7 average value).", "break_cols": ["Cardset", "Run", "In packs", "Avg value"], "breakdown": [["Base Mosaic Black", "/1", "60", "$2,617"], ["Base Mosaic Gold", "/10", "730", "$148"], ["Base Mosaic Blue", "/75", "5,526", "$5.19"], ["Pitch Masters Mosaic Black", "/1", "8", "$3,263"], ["Autographs Mosaic Choice Fusion Red", "/88", "737", "$35.24"], ["Overdrive", "/99", "1,759", "$12.11"], ["Base Silver", "/199", "14,550", "$1.45"], ["Base Mosaic", "/125", "9,195", "$1.62"], ["Breakaway Mosaic Gold Fluorescent", "/10", "99", "$144"], ["Base Mosaic Purple", "/49", "3,688", "$3.59"], ["Base Mosaic Red", "/99", "7,299", "$1.45"], ["Montage Mosaic Gold", "/10", "103", "$69.92"], ["Scripts Mosaic Gold", "/10", "97", "$64.74"], ["Stained Glass", "/99", "1,296", "$3.82"]], "live": "/api/pack-live?product=mosaic22", "mkt_label": "Packs remaining", "mkt_value": "59,156", "mkt_sub": "cards still in packs \u00f7 3 \u00b7 reward-only, not sold", "slots": [{"n": 3, "d": "Cards<br>per pack"}, {"n": 2, "d": "Base<br>#/1649"}, {"n": 1, "d": "Hit<br>40 cardsets", "hit": true}, {"n": "$14.38", "d": "Book<br>value"}], "hits_sub": "Sealed grails and star hits, ranked. Haaland's debut Base Black 1/1 is still in a pack.", "foot": "Model: tools/card-pack-model.mjs \u00b7 cards data/mosaic22-cards.json (collection report)."};
const $ = id => document.getElementById(id);
const money = n => '$' + (n >= 100 ? Math.round(n).toLocaleString('en-US') : Number(n).toFixed(2));
function draw(D) {
  $('eyebrow').textContent = D.eyebrow;
  $('h1').innerHTML = D.h1;
  $('updated').textContent = D.updated;
  $('disclaimer').innerHTML = D.disclaimer;
  $('book').textContent = money(D.book);
  $('bookSub').textContent = D.book_sub;
  $('exp').textContent = money(2 * D.book);
  $('mktLabel').textContent = D.mkt_label;
  $('mkt').textContent = D.mkt_value;
  $('mktSub').textContent = D.mkt_sub;
  $('compose').innerHTML = D.slots.map(s => '<div class="slot' + (s.hit ? ' hit' : '') + '"><div class="n">' + s.n + '</div><div class="d">' + s.d + '</div></div>').join('');
  $('hitsSub').textContent = D.hits_sub;
  $('hits').innerHTML = D.hits.map(h => '<tr><td>' + h.c + ' <span class="sub">' + h.s + '</span></td><td>/' + h.r + '</td><td>' + (h.u == null ? '<span class="sub">&mdash;</span>' : h.u) + '</td><td>' + money(h.p) + '</td></tr>').join('');
  $('breakLabel').textContent = D.break_label;
  $('breakSub').textContent = D.break_sub;
  $('breakHead').innerHTML = '<tr>' + D.break_cols.map(c => '<th>' + c + '</th>').join('') + '</tr>';
  $('break').innerHTML = D.breakdown.map(r => '<tr>' + r.map((v, i) => '<td>' + v + '</td>').join('') + '</tr>').join('');
  $('foot').innerHTML = D.foot;
}
draw(D);
// live pages: swap in the hourly-repriced numbers (D.live = its API URL); keep the baked ones on any failure
if (D.live) fetch(D.live).then(r => r.ok ? r.json() : null).then(d => { if (d && d.book) draw(d); }).catch(() => {});
</script>
</body>
</html>
