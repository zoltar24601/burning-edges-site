<style>

  :root{

  *{box-sizing:border-box;margin:0;padding:0;}

  .header-inner{max-width:1080px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
  .brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:1px;color:var(--cream);text-transform:uppercase;text-decoration:none;}

  .topnav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}

  .topnav a.active{color:var(--accent);}
  .hero{padding:40px 0 18px;text-align:center;}
  .release-name{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:10px;}
  .hero h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(36px,7vw,60px);line-height:0.98;text-transform:uppercase;color:var(--cream);}
  .hero h1 .accent{color:var(--accent);}
  .updated{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2px;color:var(--text-faint);text-transform:uppercase;margin-top:14px;}
  .disclaimer{background:rgba(232,196,104,0.07);border:1px solid var(--gold-dim);border-left:3px solid var(--gold);border-radius:10px;padding:16px 20px;margin:14px 0 30px;font-size:13.5px;color:var(--text-dim);line-height:1.6;}
  .disclaimer strong{color:var(--gold);}
  .price-band{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 14px;}
  @media(max-width:760px){.price-band{grid-template-columns:1fr;}}
  .price-card{background:linear-gradient(160deg,var(--card),var(--card-2));border:1px solid var(--border-bright);border-radius:14px;padding:26px 30px;}
  .price-card.book{border-color:var(--green);}
  .price-card.mkt{border-color:var(--gold-dim);}
  .price-card .label{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}
  .price-card.book .label{color:var(--green);}
  .price-card.mkt .label{color:var(--gold);}
  .price-big{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:52px;line-height:1;color:var(--cream);}
  .price-card.mkt .price-big{color:var(--gold);}
  .price-sub{font-size:12.5px;color:var(--text-faint);margin-top:10px;}
  .compose{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 30px;}
  @media(max-width:760px){.compose{grid-template-columns:1fr 1fr;}}
  .slot{background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
  .slot.hit{border-color:var(--accent);}
  .slot .n{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:30px;color:var(--cream);line-height:1;}
  .slot.hit .n{color:var(--accent);}
  .slot .d{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;margin-top:6px;line-height:1.4;}
  .section-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin:40px 0 4px;}
  .section-sub{font-size:13px;color:var(--text-faint);margin-bottom:18px;}
  table{width:100%;border-collapse:collapse;}
  .s2 th{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-faint);text-align:right;padding:8px 10px;border-bottom:1px solid var(--border);}

  .s2 td{padding:9px 10px;border-bottom:1px solid rgba(31,74,48,0.5);font-size:14px;text-align:right;}
  .s2 td:first-child{text-align:left;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;color:var(--cream);}
  .s2 .sub{color:var(--text-faint);font-weight:400;font-size:12.5px;}
  .foot{margin-top:44px;font-size:12px;color:var(--text-faint);text-align:center;line-height:1.7;}

</head>
